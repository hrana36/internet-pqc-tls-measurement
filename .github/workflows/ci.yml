name: PQC Measurement CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-scan:
    name: Run Pytest & Empirical Telemetry Study
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          python -m pytest tests -v

      - name: Execute Asynchronous Measurement Study
        run: |
          python benchmarks/run_empirical_study.py

      - name: Upload Empirical Study Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pqc-telemetry-artifacts-python-${{ matrix.python-version }}
          path: |
            benchmarks/handshake_latency_cdf.png
            benchmarks/empirical_telemetry_results.json
